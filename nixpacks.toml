# Coolify UI often overrides install to plain `npm install` (root has no deps).
# Build script itself installs site/ so `next` is always available.
[phases.setup]
nixPkgs = ["nodejs_20", "npm-10_x"]

[phases.install]
cmds = ["npm install --prefix site --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start --prefix site"
