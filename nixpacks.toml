# Coolify currently runs Nixpacks (not Dockerfile). Install must populate site/node_modules.
[phases.setup]
nixPkgs = ["nodejs_20", "npm-10_x"]

[phases.install]
cmds = ["npm install --prefix site --include=dev"]

[phases.build]
cmds = ["npm run build --prefix site"]

[start]
cmd = "npm run start --prefix site"
